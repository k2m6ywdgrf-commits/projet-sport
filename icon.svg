<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1535"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>
    <!-- Lightning bolt: cyan → orange → pink -->
    <linearGradient id="boltGrad" x1="60%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%"   stop-color="#5ee7ff"/>
      <stop offset="48%"  stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <!-- Soft halo behind bolt -->
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Crisp glow on the bolt edges -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>

  <!-- Ambient center glow -->
  <ellipse cx="256" cy="265" rx="155" ry="185" fill="#ff8a3d" opacity="0.07" clip-path="url(#roundedClip)"/>
  <ellipse cx="256" cy="175" rx="100" ry="90"  fill="#5ee7ff" opacity="0.05" clip-path="url(#roundedClip)"/>

  <!-- Circuit grid — top-left -->
  <g clip-path="url(#roundedClip)" opacity="0.25" stroke="#5ee7ff" stroke-width="1.5" fill="none">
    <line x1="56"  y1="118" x2="168" y2="118"/>
    <line x1="118" y1="56"  x2="118" y2="168"/>
    <circle cx="118" cy="118" r="5" fill="#5ee7ff" stroke="none"/>
    <circle cx="118" cy="118" r="14" stroke-dasharray="5 4"/>
  </g>

  <!-- Circuit grid — bottom-right -->
  <g clip-path="url(#roundedClip)" opacity="0.25" stroke="#ff8a3d" stroke-width="1.5" fill="none">
    <line x1="344" y1="394" x2="456" y2="394"/>
    <line x1="394" y1="344" x2="394" y2="456"/>
    <circle cx="394" cy="394" r="5" fill="#ff8a3d" stroke="none"/>
    <circle cx="394" cy="394" r="14" stroke-dasharray="5 4"/>
  </g>

  <!-- Faint horizontal scan-line accent -->
  <rect x="0" y="255" width="512" height="1" fill="#5ee7ff" opacity="0.06" clip-path="url(#roundedClip)"/>
  <rect x="0" y="258" width="512" height="1" fill="#5ee7ff" opacity="0.03" clip-path="url(#roundedClip)"/>

  <!-- Bolt halo (blurred duplicate for glow aura) -->
  <path d="M295 62 L168 268 L248 268 L208 450 L334 242 L254 242 Z"
        fill="#ff8a3d" filter="url(#halo)" opacity="0.55"
        clip-path="url(#roundedClip)"/>

  <!-- Lightning bolt — main fill with gradient + crisp glow -->
  <path d="M295 62 L168 268 L248 268 L208 450 L334 242 L254 242 Z"
        fill="url(#boltGrad)" filter="url(#glow)"
        clip-path="url(#roundedClip)"/>

  <!-- Bolt edge highlight (thin white inner rim for pop) -->
  <path d="M295 62 L168 268 L248 268 L208 450 L334 242 L254 242 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"
        clip-path="url(#roundedClip)"/>

  <!-- Small accent dots echoing the corners -->
  <circle cx="174" cy="188" r="4.5" fill="#5ee7ff" opacity="0.7"/>
  <circle cx="338" cy="326" r="4.5" fill="#fb7185"  opacity="0.7"/>
</svg>
